name: UI Tests with Pytest Playwright Allure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  tests:
    timeout-minutes: 15
    runs-on: ubuntu-22.04

    steps:
      # -------------------------
      # Checkout source
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Setup Python
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -------------------------
      # Install dependencies
      # -------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      # -------------------------
      # Run tests
      # -------------------------
      - name: Run tests
        continue-on-error: true
        run: |
          pytest

      # -------------------------
      # Upload RAW artifacts
      # -------------------------
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results-*
          retention-days: 7

      # -------------------------
      # Install Allure CLI
      # -------------------------
      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -Ls https://github.com/allure-framework/allure2/releases/download/2.36.0/allure-2.36.0.tgz | sudo tar -xz -C /opt/
          sudo ln -sf /opt/allure-2.36.0/bin/allure /usr/bin/allure
          allure --version

      # -------------------------
      # Configure git identity
      # -------------------------
      - name: Configure git user
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # -------------------------
      # Restore history from allure-history branch
      # -------------------------
      - name: Restore Allure history
        if: always()
        run: |
          git fetch origin || true

          if git ls-remote --exit-code --heads origin allure-history; then
            echo "allure-history branch exists. Restoring..."
            git clone --depth 1 --branch allure-history https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git allure-history
            if [ -d "allure-history/history" ]; then
              mkdir -p allure-results/history
              cp -r allure-history/history/* allure-results/history/ || true
            fi
          else
            echo "No allure-history branch yet. First run?"
          fi

      # -------------------------
      # Generate Allure report
      # -------------------------
      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

      # -------------------------
      # Update allure-history branch
      # -------------------------
      - name: Update Allure history branch
        if: always()
        run: |
          mkdir -p allure-history
          cd allure-history

          if [ ! -d ".git" ]; then
            git init
            git checkout -b allure-history
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          else
            git checkout allure-history || git checkout -b allure-history
          fi

          git rm -rf . || true
          mkdir history
          cp -r ../allure-report/history/* history/ || true

          git add history
          git commit -m "Update Allure history (run ${{ github.run_number }})" || echo "No changes to commit"
          git push origin allure-history

      # -------------------------
      # Deploy to GitHub Pages
      # -------------------------
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4
